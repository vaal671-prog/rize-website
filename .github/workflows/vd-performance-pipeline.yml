name: VD Performance Video Pipeline

on:
  schedule:
    # Offset a few minutes past the hour/20-min marks — GitHub explicitly
    # warns that schedules landing exactly on :00/:20/:40 queue behind
    # everyone else's identical schedules and are more likely to be
    # delayed or dropped under load.
    - cron: "4,24,44 * * * *"
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coaching-online/scripts/montage
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships ffmpeg preinstalled, but pin an explicit install
      # instead of relying on that (third-party actions like
      # FedericoCarboni/setup-ffmpeg have flaky version-parsing failures —
      # apt-get is boring and reliable).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account key
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > service-account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Run pipeline
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_SERVICE_ACCOUNT_FILE: service-account.json
          R2_ACCOUNT_ENDPOINT: ${{ secrets.R2_ACCOUNT_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          SETSMART_API_KEY: ${{ secrets.SETSMART_API_KEY }}
          SETSMART_TEMPLATE_NAME: ${{ secrets.SETSMART_TEMPLATE_NAME }}
        run: python run_pipeline.py

      - name: Clean up service account key
        if: always()
        run: rm -f service-account.json
